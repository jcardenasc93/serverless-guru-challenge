# serverless.yml

org: jcardenasc93personal

service: airlines-app
frameworkVersion: '4.6.2'

provider:
  name: aws
  runtime: python3.10
  region: us-east-1
  environment:
    ENVIRONMENT: ${sls:stage}
    DYNAMODB_AIRLINE_TABLE: ${sls:stage}-airlineTable
    DYNAMODB_DESTINATION_TABLE: ${sls:stage}-destinationTable
    AIRLINES_ENDPOINT_URL: ${cf:${self:service}-${self:provider.stage}.airlinesAPIURL}
  stage: ${sls:stage, 'dev'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:DescribeTable
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_AIRLINE_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_DESTINATION_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_DESTINATION_TABLE}/index/airline-index"

resources:
  Resources:
    ${file(./dynamodb.yml)}
  Outputs:
    airlinesAPIURL:
      Value:
        Fn::Sub: "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/airlines/api/v1/"
      Export:
        Name: ${self:service}-${self:provider.stage}-airlinesAPIURL


functions:
  airlineAPI:
    name: ${sls:stage}-airlineLambda
    handler: airline.app.handler
    timeout: 15
    package:
      include:
        - ./airline/**
        - ./common/**
    events:
      - httpApi:
          path: /airlines/api/v1/{proxy+}
          method: any
      - httpApi:
          path: /airlines/api/v1
          method: any
  destinationAPI:
    name: ${sls:stage}-destinationLambda
    handler: destination.app.handler
    timeout: 15
    package:
      include:
        - ./destination/**
        - ./common/**
    events:
      - httpApi:
          path: /destinations/api/v1/{proxy+}
          method: any
      - httpApi:
          path: /destinations/api/v1
          method: any

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    slim: true
